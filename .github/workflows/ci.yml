name: CI Validation & Quality Gate

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Lint, Typecheck, Test Suites & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: "Security Sentinel: Check for tracked sensitive files and tokens"
        run: |
          TRACKED_SECRETS=$(git ls-files ".env*" "*service_role*" "*secret*" "*.pem" "*.key" || true)
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "::error::Found tracked sensitive files in repository:"
            echo "$TRACKED_SECRETS"
            exit 1
          fi

          TOKEN_LEAKS=$(git grep -E "shpat_[a-zA-Z0-9]{20,}" src/ || true)
          if [ -n "$TOKEN_LEAKS" ]; then
            echo "::error::Found hardcoded Shopify access token pattern in source:"
            echo "$TOKEN_LEAKS"
            exit 1
          fi

          echo "Security scan passed: no tracked secrets or hardcoded private tokens."

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting (oxfmt)
        run: npm run lint

      - name: Run TypeScript static analysis
        run: npm run typecheck

      - name: Verify database migration ordering and schema integrity
        run: npm run verify:migrations

      - name: Run automated security, auth & webhook test suite
        run: npm run test:security

      - name: Run Shopify Storefront catalog & inventory pipeline test suite
        run: npm run test:shopify

      - name: Run Find My PC intelligence & 100-scenario quality benchmark
        run: npm run test:builder

      - name: Run full automated edge regression test suite (318 tests)
        run: npm run test:edge

      - name: Run Vite production build
        run: npm run build

      - name: Verify production build distribution artifacts
        run: |
          if [ ! -s "dist/index.html" ]; then
            echo "::error::dist/index.html is missing or empty after production build."
            exit 1
          fi
          echo "Production build verified: dist/index.html exists and is non-empty."
